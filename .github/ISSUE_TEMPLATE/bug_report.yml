name: Bug report
description: A problem with the docs, the snippet or a tool
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [troubleshooting guide](https://github.com/LuisPeixoto/hackintosh-dual-display-flicker-fix/blob/main/docs/troubleshooting.md) first.
        **Remove personal data** (serials, UUIDs, SMBIOS values) from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.2 (25C56)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      render: shell
